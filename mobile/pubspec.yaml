name: mobile
description: AgroSentry Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_image_compress: ^2.1.0
  permission_handler: ^11.1.0
  connectivity_plus: ^7.3.1
  flutter_svg: ^2.0.9
  logger: ^2.0.2+1
  envied: ^0.5.4
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  http_parser: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  envied_generator: ^0.5.4
  mockito: ^5.4.4
  network_image_mock: ^2.1.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
